job_name: synergy-deepswe-thinking-max-v3
n_concurrent_trials: 8
agent_timeout_multiplier: 4.0
verifier_timeout_multiplier: 2.0
n_attempts: 1
quiet: false
environment:
  type: docker
  mounts:
  - type: bind
    source: /root/synergy-src/packages/synergy/dist
    target: /opt/synergy-dev-dist
    read_only: true
  - type: bind
    source: /root/synergy-src/node_modules
    target: /opt/synergy-dev-node_modules
    read_only: true
agents:
- import_path: synergy_harbor.dev:SynergyDev
  model_name: deepseek/deepseek-v4-flash
  kwargs:
    agent: synergy-max
    export_model_patch: true
    variant: max
    workflow_prompt: true
    extra_allowed_hosts:
    - api.deepseek.com
  env:
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
datasets:
- path: /root/deep-swe/tasks
  task_names:
  - boa-hierarchical-evaluation-cancellation
  - expr-try-catch-errors
  - fastapi-implicit-head-options
  - geo-shapeindex-serialization
  - mnamer-daemon-watch-lifecycle
  - mobly-grouped-test-barriers
