[project]
name = "synergy-harbor-adapter"
version = "0.1.0"
description = "Harbor installed-agent adapter for Synergy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Synergy contributors" }]
dependencies = [
  "harbor==0.20.0",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "synergy_harbor"

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.15.17",
  "ty>=0.0.49",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-config", "--strict-markers"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
include = ["src", "tests"]
